<!DOCTYPE html>
<html>
<head>
    <title>Lab 1</title>
</head>
<body>
    <button id="add">Add to cart</button>
    <span id="count">0</span>

    <script>
    let count = 0;
    document.getElementById('add').addEventListener('click', () => {
        count = count + 1;
        document.getElementById('count').innerText = counter; // typo
    });
    </script>
</body>
</html>
